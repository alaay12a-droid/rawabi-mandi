kind = "mobile"
previewPath = "/sunmi-order-printer/"
title = "طابعة الطلبات المستقلة"
description = "تطبيق Android مستقل لجهاز Sunmi V3 لإدارة طلبات المطعم، التنبيه المستمر، الطباعة الحرارية التلقائية دون تكرار، وإسناد مناديب التوصيل، مع خادم وبيانات مستقلين."
version = "1.0.0"
id = "artifacts/sunmi-order-printer"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/sunmi-order-printer/" ]
localPort = 20118

[services.development]
run = "pnpm --filter @workspace/sunmi-order-printer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sunmi-order-printer", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sunmi-order-printer", "run", "serve" ]

[services.env]
PORT = "20118"
BASE_PATH = "/sunmi-order-printer/"
