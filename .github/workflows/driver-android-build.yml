name: Driver Android Build (APK)

on:
  workflow_dispatch:

jobs:
  build-driver-apk:
    name: Build Driver APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Driver APK
        working-directory: artifacts/rawabi-driver
        run: |
          EAS_PROJECT_ROOT="$(pwd)" \
          EAS_NO_VCS=1 \
          TMPDIR=/tmp \
          EAS_BUILD_NO_EXPO_GO_WARNING=true \
          eas build --platform android --profile preview --non-interactive --no-wait

      - name: Print build URL
        run: |
          echo "Build started on Expo servers."
          echo "https://expo.dev/accounts/021837ala/projects/rawabi-driver/builds"