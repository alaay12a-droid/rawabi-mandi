name: Sunmi Printer APK

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Publish the APK from a successful Sunmi run without rebuilding (leave empty for a new build)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sunmi-printer-apk
  cancel-in-progress: false

jobs:
  build-sunmi:
    if: ${{ inputs.artifact_run_id == '' }}
    name: Build signed standalone Sunmi APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_BASE_URL: https://rawabi-mandi-e5rz.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated printer build directory
        run: echo "SUNMI_NATIVE_DIR=$RUNNER_TEMP/sunmi-native" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"
          run_install: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare isolated printer project
        run: node artifacts/sunmi-order-printer/scripts/prepare-native-build.cjs "$SUNMI_NATIVE_DIR"
      - name: Install printer dependencies only
        run: cd "$SUNMI_NATIVE_DIR" && pnpm install --no-frozen-lockfile
      - name: Validate TypeScript and native identity
        run: |
          cd "$SUNMI_NATIVE_DIR"
          pnpm exec tsc --noEmit
          node -e "const c=require('./app.json').expo;if(c.name!=='چڤن'||c.slug!=='sunmi-order-printer'||c.android.package!=='com.standalone.sunmiorderprinter')throw Error('Unexpected app identity')"
      - name: Check printer and alarm regression tests
        run: NODE_PATH="$SUNMI_NATIVE_DIR/node_modules" node artifacts/sunmi-order-printer/scripts/test-terminal.cjs
      - name: Generate Android native project
        run: cd "$SUNMI_NATIVE_DIR" && pnpm exec expo prebuild --platform android --no-install
      - name: Build signed release APK
        env:
          SUNMI_KEYSTORE_BASE64: ${{ secrets.SUNMI_KEYSTORE_BASE64 }}
          SUNMI_KEYSTORE_PASSWORD: ${{ secrets.SUNMI_KEYSTORE_PASSWORD }}
          SUNMI_KEY_ALIAS: ${{ secrets.SUNMI_KEY_ALIAS }}
          SUNMI_KEY_PASSWORD: ${{ secrets.SUNMI_KEY_PASSWORD }}
          SUNMI_KEYSTORE_FILE: ${{ runner.temp }}/sunmi-signing.jks
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          node - <<'JS'
          const fs=require('fs');
          for(const k of ['SUNMI_KEYSTORE_BASE64','SUNMI_KEYSTORE_PASSWORD','SUNMI_KEY_ALIAS','SUNMI_KEY_PASSWORD']) {
            if(!process.env[k])throw Error('Missing signing secret: '+k);
          }
          fs.writeFileSync(process.env.SUNMI_KEYSTORE_FILE,Buffer.from(process.env.SUNMI_KEYSTORE_BASE64,'base64'),{mode:0o600});
          JS
          cd "$SUNMI_NATIVE_DIR/android"
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 \
            -I "$GITHUB_WORKSPACE/artifacts/sunmi-order-printer/scripts/sunmi-signing.gradle"
      - name: Verify release and package APK
        run: |
          set -euo pipefail
          APK="$SUNMI_NATIVE_DIR/android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          python artifacts/sunmi-order-printer/scripts/verify-apk.py "$APK" "$BUILD_TOOLS/aapt"
          mkdir -p "$RUNNER_TEMP/sunmi-apk"
          cp "$APK" "$RUNNER_TEMP/sunmi-apk/sunmi-printer.apk"
          sha256sum "$RUNNER_TEMP/sunmi-apk/sunmi-printer.apk" > "$RUNNER_TEMP/sunmi-apk/SHA256SUMS.txt"
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Smoke-test signed release on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python artifacts/sunmi-order-printer/scripts/android-smoke-test.py
      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunmi-startup-diagnostics
          path: ${{ runner.temp }}/sunmi-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: sunmi-printer-apk
          path: ${{ runner.temp }}/sunmi-apk/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sunmi-signing.jks"

  publish-existing-sunmi:
    name: Publish verified Sunmi APK without rebuilding
    if: ${{ inputs.artifact_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate successful printer run and unchanged printer sources
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid run ID"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > "$RUNNER_TEMP/sunmi-source-run.json"
          python - <<'PY'
          import json, os, pathlib, re
          run = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "sunmi-source-run.json").read_text())
          if run["path"] != ".github/workflows/sunmi-android-apk.yml":
              raise RuntimeError("Not a Sunmi printer workflow")
          if run["status"] != "completed" or run["conclusion"] != "success":
              raise RuntimeError("Printer APK run did not pass")
          sha = run["head_sha"]
          if not re.fullmatch(r"[a-f0-9]{40}", sha):
              raise RuntimeError("Invalid source commit")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SUNMI_SOURCE_SHA={sha}\n")
          PY
          SOURCE_SHA="$(python -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/sunmi-source-run.json'))['head_sha'])")"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- artifacts/sunmi-order-printer
      - name: Download and checksum the existing APK
        run: |
          set -euo pipefail
          gh run download "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name sunmi-printer-apk --dir "$RUNNER_TEMP/sunmi-download"
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "sunmi-download"
          apk = source / "sunmi-printer.apk"
          checksum = (source / "SHA256SUMS.txt").read_text().split()[0]
          actual = hashlib.sha256(apk.read_bytes()).hexdigest()
          if actual != checksum:
              raise RuntimeError("APK checksum mismatch")
          config = json.loads(pathlib.Path("artifacts/sunmi-order-printer/app.json").read_text())["expo"]
          if config["android"]["package"] != "com.standalone.sunmiorderprinter":
              raise RuntimeError("Not the printer application")
          version, code = config["version"], config["android"]["versionCode"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version) or not isinstance(code, int) or code < 1:
              raise RuntimeError("Invalid printer version")
          out = root / "sunmi-release"
          out.mkdir()
          name = f"sunmi-printer-{version}-{code}.apk"
          apk.rename(out / name)
          (out / "SHA256SUMS.txt").write_text(f"{actual}  {name}\n")
          notes = (
              f"Sunmi printer only: version {version}, Android versionCode {code}.\n\n"
              "Standalone signed release APK. Passed Android emulator startup check; "
              "physical receipt printing still needs verification on a Sunmi device.\n\n"
              f"Source: {os.environ['SUNMI_SOURCE_SHA']}\nSHA-256: {actual}\n"
          )
          (root / "sunmi-release-notes.txt").write_text(notes)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SUNMI_RELEASE_TAG=sunmi-printer-v{version}\n")
              env.write(f"SUNMI_RELEASE_NAME=Sunmi printer {version} ({code})\n")
              env.write(f"SUNMI_RELEASE_APK={out / name}\n")
          PY
      - name: Publish the verified printer APK only
        run: |
          set -euo pipefail
          if ! gh release view "$SUNMI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$SUNMI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$SUNMI_SOURCE_SHA" --title "$SUNMI_RELEASE_NAME" \
              --notes-file "$RUNNER_TEMP/sunmi-release-notes.txt" --draft
          fi
          gh release view "$SUNMI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish \
            --jq 'select(.isDraft and .targetCommitish == env.SUNMI_SOURCE_SHA) | true' | grep -qx true
          gh release upload "$SUNMI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "$SUNMI_RELEASE_APK" "$RUNNER_TEMP/sunmi-release/SHA256SUMS.txt"
          gh release edit "$SUNMI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
